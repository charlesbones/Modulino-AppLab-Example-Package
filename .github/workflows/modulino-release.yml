# 1. Daily: when a new Arduino_Modulino is released, pin it (plus its
#    dependencies) in every sketch.yaml on a new branch named after the version
#    (e.g. 0.11.0), branched from main. Test it on hardware, then merge to main.
# 2. On push to main: if the pinned Arduino_Modulino version has no package
#    release yet, publish one (v0.N+1) in the same layout as v0.1.
name: Release on new Arduino_Modulino

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["*/sketch/sketch.yaml"]

permissions:
  contents: write

concurrency: modulino-release

jobs:
  bump-branch:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Test bump script
        working-directory: .github/scripts
        run: python3 test_bump_modulino.py

      - name: Pin latest Arduino_Modulino
        id: bump
        run: python3 .github/scripts/bump_modulino.py

      - name: Push version branch
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if git diff --quiet; then echo "main already pins $VERSION"; exit 0; fi
          if git ls-remote --exit-code --heads origin "$VERSION" >/dev/null; then
            echo "branch $VERSION already exists"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git switch -c "$VERSION"
          git commit -am "Bump Arduino_Modulino to $VERSION"
          git push origin "$VERSION"

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(grep -ohP 'Arduino_Modulino \(\K[^)]+' */sketch/sketch.yaml | sort -u)
          if [ "$(echo "$pinned" | wc -l)" -ne 1 ]; then echo "sketches disagree: $pinned"; exit 1; fi
          if gh release list --limit 100 --json name -q '.[].name' | grep -qF "(Arduino_Modulino $pinned)"; then
            echo "release for Arduino_Modulino $pinned already exists"; exit 0
          fi
          last=$(git tag -l 'v0.*' --sort=-v:refname | head -1)
          tag="v0.$(( ${last#v0.} + 1 ))"
          name="Modulino-AppLab-example-package-$tag"
          mkdir -p "dist/$name"
          for d in modulino-*/; do d=${d%/}; zip -qr "dist/$name/$d.zip" "$d"; done
          (cd dist && zip -qr "$name.zip" "$name")
          gh release create "$tag" "dist/$name.zip" \
            --target "$(git rev-parse HEAD)" \
            --title "Modulino AppLab example package $tag (Arduino_Modulino $pinned)" \
            --notes "Built against Arduino_Modulino $pinned ([changelog](https://github.com/arduino-libraries/Arduino_Modulino/releases/tag/$pinned))."
